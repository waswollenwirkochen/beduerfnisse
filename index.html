<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="referrer" content="no-referrer">

<title>Bedürfnis-Diary</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1d22'/%3E%3Ccircle cx='44' cy='18' r='8' fill='%23e9b872'/%3E%3Ccircle cx='48' cy='15' r='7' fill='%230f1d22'/%3E%3Cpath d='M20 52 L30 30 L40 52Z M8 54 L18 36 L28 54Z M34 54 L44 38 L56 54Z' fill='%2393b48b'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#0b1419; --card:rgba(22,34,36,.78); --card2:rgba(34,50,50,.7);
  --line:rgba(241,232,214,.11); --text:#f1e8d6; --muted:#a9a290; --faint:#7d7868;
  --amber:#e9b872; --amber2:#f4d29c; --moss:#93b48b; --lilac:#b7a7e3; --rose:#e39c8f; --sky:#8fb6d8;
  --r:18px; --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5}
body{min-height:100vh;overflow-x:hidden}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;max-width:640px;margin:0 auto;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:var(--text)}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:.01em;margin:0}
a{color:var(--amber)}

/* header */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(10px + var(--safe-t)) 16px 10px;
  background:linear-gradient(180deg,rgba(11,20,25,.96),rgba(11,20,25,.82));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{font-size:1.2rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{font-family:var(--sans);font-size:.75rem;color:var(--muted);font-weight:400;margin-left:6px}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:1.1rem;color:var(--muted)}
.iconbtn:active{background:var(--card2)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--faint);display:inline-block}
.dot.ok{background:var(--moss)} .dot.pending,.dot.syncing{background:var(--amber)} .dot.error{background:var(--rose)}
.dot.syncing{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

main{padding:14px 14px calc(96px + var(--safe-b))}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;
  background:linear-gradient(0deg,rgba(9,16,19,.98),rgba(11,20,25,.9));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.tabs .in{display:flex;width:100%;max-width:640px}
nav.tabs button{flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.7rem;color:var(--faint)}
nav.tabs button .i{font-size:1.25rem;filter:grayscale(.7) opacity(.75);transition:.2s}
nav.tabs button.on{color:var(--amber2)}
nav.tabs button.on .i{filter:none;transform:translateY(-1px)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.card h2{font-size:1.08rem;margin-bottom:4px}
.card h3{font-size:.98rem;margin:14px 0 6px}
.sub{color:var(--muted);font-size:.86rem;margin:0 0 10px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:.84rem}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:rgba(241,232,214,.04);border-radius:999px;padding:7px 13px;font-size:.92rem;line-height:1.2;color:var(--text);transition:background .15s,border-color .15s}
.chip:active{transform:scale(.97)}
.chip.on{background:rgba(233,184,114,.18);border-color:rgba(233,184,114,.6);color:var(--amber2)}
.chip.on.moss{background:rgba(147,180,139,.2);border-color:rgba(147,180,139,.65);color:#cfe3c9}
.chip.on.rose{background:rgba(227,156,143,.18);border-color:rgba(227,156,143,.6);color:#f2c6bd}
.chip.on.lilac{background:rgba(183,167,227,.2);border-color:rgba(183,167,227,.6);color:#ddd3f7}
.chip.add{border-style:dashed;color:var(--muted)}
.chip.sm{padding:5px 10px;font-size:.84rem}
.chip .x{margin-left:6px;color:var(--rose)}
.chip .n{font-size:.72rem;color:var(--faint);margin-left:5px}

/* inputs */
.field{width:100%;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
.field:focus{border-color:rgba(233,184,114,.55)}
textarea.field{resize:vertical;min-height:70px}
label.lbl{display:block;font-size:.82rem;color:var(--muted);margin:12px 0 5px}
.btn{background:var(--amber);color:#2a1e0c;font-weight:600;border-radius:12px;padding:11px 16px}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:rgba(241,232,214,.06);color:var(--text);border:1px solid var(--line);font-weight:500}
.btn.danger{background:rgba(227,156,143,.15);color:var(--rose);border:1px solid rgba(227,156,143,.4)}
.btn.full{width:100%}
.btn.sm{padding:7px 12px;font-size:.88rem;border-radius:10px}
.link{color:var(--amber);font-size:.88rem;padding:4px 0}
.addrow{display:flex;gap:6px;margin-top:8px}
.addrow .field{padding:8px 11px}
.addrow .btn{padding:8px 13px}

/* scale */
.scale{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:3px}
.scale button{aspect-ratio:1;padding:0;min-width:0;border-radius:50%;border:1px solid var(--line);font-size:.82rem;color:var(--muted);background:rgba(241,232,214,.03);max-width:42px;justify-self:center;width:100%}
.scale button.on{background:var(--amber);color:#2a1e0c;border-color:var(--amber);font-weight:700;box-shadow:0 0 14px rgba(233,184,114,.45)}
.scale-l{display:flex;justify-content:space-between;font-size:.74rem;color:var(--faint);margin-top:5px}

/* need panel */
.npanel{margin-top:10px;border-left:2px solid rgba(147,180,139,.5);padding:4px 0 4px 12px}
.npanel .t{font-weight:600;font-size:.92rem;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}

/* segmented */
.seg{display:flex;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:3px;margin-bottom:12px;gap:2px}
.seg button{flex:1;padding:8px 4px;border-radius:11px;font-size:.86rem;color:var(--muted)}
.seg button.on{background:var(--card2);color:var(--amber2)}
.seg3{display:flex;gap:6px}
.seg3 button{flex:1;padding:10px 6px;border-radius:12px;border:1px solid var(--line);font-size:.88rem;background:rgba(241,232,214,.03)}
.seg3 button.on{border-color:rgba(233,184,114,.6);background:rgba(233,184,114,.15);color:var(--amber2)}

/* date nav */
.datenav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.datenav .d{text-align:center}
.datenav .d b{font-family:var(--serif);font-size:1.25rem;font-weight:600;display:block}
.datenav .d span{font-size:.8rem;color:var(--muted)}
.datenav button.arr{width:42px;height:42px;border-radius:50%;font-size:1.3rem;color:var(--muted);border:1px solid var(--line)}
.datenav button.arr:disabled{opacity:.25}

/* affirmation */
.aff{background:radial-gradient(120% 140% at 85% 0%,rgba(183,167,227,.22),transparent 60%),var(--card);border-color:rgba(183,167,227,.25);text-align:center;padding:18px 18px 14px;cursor:pointer}
.aff p{font-family:var(--serif);font-size:1.12rem;margin:0;color:#ece4fb;line-height:1.45}
.aff small{display:block;margin-top:8px;font-size:.72rem;color:var(--faint)}

/* list items */
.item{border-top:1px solid var(--line);padding:10px 0}
.item:first-child{border-top:0}
.item .meta{font-size:.78rem;color:var(--faint)}
.gfk-prev{font-family:var(--serif);font-style:italic;color:#e6dcc6;background:rgba(233,184,114,.07);border-left:2px solid rgba(233,184,114,.5);padding:8px 12px;border-radius:0 10px 10px 0;margin-top:8px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.box{flex:none;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:.8rem;margin-top:1px}
.box.on{background:var(--moss);border-color:var(--moss);color:#14201a}

/* stats */
.bars .b{display:grid;grid-template-columns:minmax(90px,38%) 1fr;gap:8px;align-items:center;margin:7px 0;font-size:.86rem}
.bars .track{display:flex;flex-direction:column;gap:3px}
.bars .bar{height:8px;border-radius:5px;min-width:2px}
.bars .bar.m{background:var(--moss)} .bars .bar.r{background:var(--rose);opacity:.85}
.big{font-family:var(--serif);font-size:1.9rem;color:var(--amber2);line-height:1.1}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.kpi .v{font-family:var(--serif);font-size:1.45rem;color:var(--amber2)}
.kpi .l{font-size:.72rem;color:var(--muted);line-height:1.25}
.legend{display:flex;gap:14px;font-size:.76rem;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* week */
.days7{display:flex;gap:6px;margin-top:8px}
.days7 div{flex:1;text-align:center;font-size:.7rem;color:var(--faint)}
.days7 div i{display:block;height:26px;border-radius:8px;border:1px solid var(--line);margin-bottom:3px;background:rgba(241,232,214,.03)}
.days7 div i.on{background:rgba(147,180,139,.55);border-color:var(--moss)}
.days7 div i.sh{background:rgba(227,156,143,.35);border-color:rgba(227,156,143,.6)}
.block{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.block:first-child{border-top:0}
.block .when{font-size:.78rem;color:var(--amber2);min-width:64px;line-height:1.25}
.st{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);font-size:.95rem;color:var(--muted)}
.st.ja{background:rgba(147,180,139,.3);border-color:var(--moss);color:#d6ead0}
.st.nein{background:rgba(227,156,143,.25);border-color:var(--rose);color:#f5cdc5}

/* gfk text */
.prose p{margin:0 0 10px}
.prose ul{margin:0 0 10px;padding-left:20px}
.prose li{margin:3px 0}
.prose b{color:var(--amber2);font-weight:600}
.prose .ex{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;background:rgba(0,0,0,.2);border-radius:12px;padding:10px 12px;margin:8px 0 12px;font-size:.92rem}
.prose .ex .no{color:var(--rose)} .prose .ex .yes{color:var(--moss)}
.step{display:flex;gap:12px;align-items:flex-start;margin:10px 0}
.step .num{flex:none;width:30px;height:30px;border-radius:50%;background:rgba(233,184,114,.16);border:1px solid rgba(233,184,114,.5);color:var(--amber2);display:grid;place-items:center;font-family:var(--serif);font-weight:700}
details.acc{border-top:1px solid var(--line);padding:4px 0}
details.acc:first-of-type{border-top:0}
details.acc summary{cursor:pointer;list-style:none;padding:10px 0;font-family:var(--serif);font-size:1.02rem;display:flex;justify-content:space-between;align-items:center}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"＋";color:var(--muted);font-family:var(--sans)}
details.acc[open] summary::after{content:"－"}
.formula{font-family:var(--serif);font-size:1.02rem;background:rgba(233,184,114,.08);border:1px solid rgba(233,184,114,.25);border-radius:14px;padding:12px 14px;line-height:1.7}
.formula em{color:var(--amber2);font-style:normal}
.pseudo{display:grid;grid-template-columns:1fr;gap:6px}
.pseudo div{background:rgba(0,0,0,.2);border-radius:10px;padding:8px 10px;font-size:.88rem}
.pseudo b{color:var(--rose)}
.streak{display:inline-flex;align-items:center;gap:6px;background:rgba(233,184,114,.12);border:1px solid rgba(233,184,114,.35);border-radius:999px;padding:4px 11px;font-size:.82rem;color:var(--amber2)}

/* lock */
.lock{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:30px 22px calc(30px + var(--safe-b))}
.lock .moon{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;box-shadow:inset -18px -6px 0 0 var(--amber2);filter:drop-shadow(0 0 24px rgba(233,184,114,.35));transform:rotate(-20deg)}
.lock h1{text-align:center;font-size:1.7rem;margin-bottom:6px}
.lock p.c{text-align:center;color:var(--muted);margin:0 0 22px;font-size:.93rem}
.err{color:var(--rose);font-size:.88rem;margin-top:8px;min-height:1.2em}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);background:#2a3a37;border:1px solid var(--line);color:var(--text);padding:9px 16px;border-radius:999px;font-size:.88rem;z-index:20;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.hidden-user{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.center{text-align:center}
.mt{margin-top:10px} .mt2{margin-top:16px} .mb0{margin-bottom:0}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
/* =========================================================================
   Bedürfnis-Diary – alle persönlichen Daten werden im Browser mit AES-256-GCM
   verschlüsselt (Schlüssel aus Passphrase via PBKDF2-SHA256). Dieser Code
   enthält keine persönlichen Inhalte.
   ========================================================================= */

/* ---------- Himmel & Wald ---------- */
(function sky(){
  const c=document.getElementById('sky'), x=c.getContext('2d');
  function draw(){
    const w=innerWidth,h=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
    c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';x.setTransform(dpr,0,0,dpr,0,0);
    const g=x.createLinearGradient(0,0,0,h);
    g.addColorStop(0,'#09111d');g.addColorStop(.45,'#0d1b22');g.addColorStop(1,'#14251f');
    x.fillStyle=g;x.fillRect(0,0,w,h);
    const neb=x.createRadialGradient(w*.8,h*.12,0,w*.8,h*.12,w*.7);
    neb.addColorStop(0,'rgba(183,167,227,.10)');neb.addColorStop(1,'rgba(183,167,227,0)');
    x.fillStyle=neb;x.fillRect(0,0,w,h);
    let s=7;const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647};
    for(let i=0;i<Math.round(w*h/5200);i++){
      const px=rnd()*w,py=rnd()*h*.72,r=rnd()*1.1+.2,a=rnd()*.6+.15;
      x.fillStyle=`rgba(${rnd()>.8?'244,210,156':'241,232,214'},${a*(1-py/h)})`;
      x.beginPath();x.arc(px,py,r,0,7);x.fill();
    }
    const layers=[[.80,'rgba(20,38,32,.55)',34],[.86,'rgba(14,28,24,.8)',26],[.92,'rgba(9,19,16,.95)',20]];
    layers.forEach(([base,col,sz])=>{
      x.fillStyle=col;x.beginPath();x.moveTo(0,h);
      for(let px=-10;px<w+20;px+=sz*.55){
        const th=sz*(1.3+rnd()*1.6), by=h*base+rnd()*10;
        x.lineTo(px,by);x.lineTo(px+sz*.28,by-th);x.lineTo(px+sz*.56,by);
      }
      x.lineTo(w,h);x.closePath();x.fill();
    });
  }
  draw();let t;addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(draw,200)});
})();

/* ---------- Helfer ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const now=()=>Date.now();
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const WDL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const fmtLong=s=>{const d=parse(s);return `${d.getDate()}. ${MON[d.getMonth()]}`};
const fmtShort=s=>{const d=parse(s);return `${WD[d.getDay()]}, ${d.getDate()}.${d.getMonth()+1}.`};
function isoWeek(s){const d=parse(s);const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();const w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);return `${y}-W${pad(w)}`}
function weekStart(s){const d=parse(s);const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return ymd(d)}
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function h(t,a,...kids){
  const e=document.createElement(t);
  if(a)for(const k in a){const v=a[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(k==='html')e.innerHTML=v;
    else if(k==='value')e.value=v;else if(k==='checked')e.checked=v;
    else e.setAttribute(k,v===true?'':v);}
  for(const c of kids.flat(9)){if(c==null||c===false)continue;e.append(c.nodeType?c:String(c))}
  return e;
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800)}
const live=arr=>(arr||[]).filter(x=>!x.del);

/* ---------- Krypto ---------- */
const TE=new TextEncoder(),TD=new TextDecoder();
const ITER=400000;
function b64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
function unb64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function deriveKey(pass,saltB64,iter){
  const base=await crypto.subtle.importKey('raw',TE.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(saltB64),iterations:iter||ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encWith(key,obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,TE.encode(JSON.stringify(obj))));
  return {iv:b64(iv),ct:b64(ct)};
}
async function decWith(key,env){

function remap(k,from,to){
  const D=S.data,sw=a=>[...new Set((a||[]).map(x=>x===from?to:x))];
  if(k==='needs'){
    Object.values(D.days).forEach(d=>{let ch=false;
      if(d.met&&from in d.met){d.met[to]=[...new Set([...(d.met[to]||[]),...d.met[from]])];delete d.met[from];ch=true}
      if((d.short||[]).includes(from)){d.short=sw(d.short);ch=true}
      (d.good||[]).forEach(g=>{if((g.needs||[]).includes(from)){g.needs=sw(g.needs);ch=true}});
      if(ch)d.u=now()});
    D.logs.forEach(l=>{if(l.need===from){l.need=to;l.u=now()}});
    Object.values(D.weeks).forEach(w=>{if(w.focus===from)w.focus=to;(w.blocks||[]).forEach(b=>{if(b.need===from){b.need=to;b.u=now()}})});
    if(D.activities[from]){const t=D.activities[to]=D.activities[to]||[];
      D.activities[from].forEach(a=>{const e=t.find(x=>x.id===a.id);if(e){e.n=(e.n||0)+(a.n||0);e.del=false;e.u=now()}else t.push({...a,u:now()});a.del=true;a.u=now()})}
  }
  if(k==='signals')Object.values(D.days).forEach(d=>{if((d.signals||[]).includes(from)){d.signals=sw(d.signals);d.u=now()}});
  const lk={feelings:'feel',contexts:'ctx',people:'people'}[k];
  if(lk)D.logs.forEach(l=>{if((l[lk]||[]).includes(from)){l[lk]=sw(l[lk]);l.u=now()}});
}
function cleanup(){
  const D=S.data;let changed=false;
  const refs={needs:new Map(),signals:new Map(),feelings:new Map(),contexts:new Map(),people:new Map()};
  const inc=(k,id)=>{if(id)refs[k].set(id,(refs[k].get(id)||0)+1)};
  Object.values(D.days).forEach(d=>{Object.keys(d.met||{}).forEach(id=>inc('needs',id));(d.short||[]).forEach(id=>inc('needs',id));
    (d.signals||[]).forEach(id=>inc('signals',id));(d.good||[]).forEach(g=>(g.needs||[]).forEach(id=>inc('needs',id)))});
  live(D.logs).forEach(l=>{inc('needs',l.need);(l.feel||[]).forEach(id=>inc('feelings',id));(l.ctx||[]).forEach(id=>inc('contexts',id));(l.people||[]).forEach(id=>inc('people',id))});
  Object.values(D.weeks).forEach(w=>{inc('needs',w.focus);live(w.blocks).forEach(b=>inc('needs',b.need))});
  Object.keys(D.activities).forEach(id=>{if((D.activities[id]||[]).some(a=>!a.del&&a.n>0))inc('needs',id)});
  for(const k of Object.keys(refs)){
    const r=id=>refs[k].get(id)||0;const byName=new Map();
    live(D[k]).forEach(x=>{const key=x.name.trim().toLowerCase();const prev=byName.get(key);if(!prev){byName.set(key,x);return}
      const keep=(r(x.id)>r(prev.id)||(r(x.id)===r(prev.id)&&(x.u||0)>(prev.u||0)))?x:prev;const drop=keep===x?prev:x;
      remap(k,drop.id,keep.id);refs[k].set(keep.id,r(keep.id)+r(drop.id));drop.del=true;drop.u=now();byName.set(key,keep);changed=true});
    if(D.imported)live(D[k]).forEach(x=>{if(x.u===1&&!r(x.id)){x.del=true;x.u=now();changed=true}});
  }
  return changed;
}
function migrate(){
  const D=S.data;let ch=false;
  D.logs.forEach(l=>{if(!l.type){l.type='nachgegeben';ch=true}});
  if((D.migr||0)<2){['erleichtert','stolz','ruhig','klar','verbunden','aufgeregt','unsicher'].forEach(n=>addToList('feelings',n));D.gfkExtra=D.gfkExtra||{feel:[],need:[]};D.migr=2;ch=true}
  if((D.migr||0)<3){D.reactions=D.reactions||[];[['verständnisvoll',0],['neutral',0],['Diskussion',0],['Streit',1],['Vorwürfe',1],['Rückzug / Kälte',1],['bestraft / Konsequenzen',1]].forEach(([n,neg])=>{const r=addToList('reactions',n);if(neg)r.neg=true});D.migr=3;ch=true}
  if(cleanup())ch=true;
  if(ch)touch();
}

/* ---------- GitHub-Sync ---------- */
const hasRemote=()=>!!(CFG&&CFG.owner&&CFG.repo&&S.token);
function setSync(state,err){S.sync.state=state;if(err!==undefined)S.sync.err=err;const d=$('#syncdot');if(d){d.className='dot '+state;d.title=syncLabel()}}
function syncLabel(){const s=S.sync;return {off:'Kein Sync eingerichtet – nur auf diesem Gerät',ok:'Synchronisiert',pending:'Änderungen warten auf Sync',syncing:'Synchronisiere …',error:'Sync-Fehler: '+s.err}[s.state]||''}
function apiUrl(){return `https://api.github.com/repos/${encodeURIComponent(CFG.owner)}/${encodeURIComponent(CFG.repo)}/contents/${CFG.path||'diary.enc.json'}`}
async function gh(method,body,accept,token){
  const r=await fetch(apiUrl()+(method==='GET'?'?t='+now():''),{method,cache:'no-store',
    headers:{Authorization:'Bearer '+(token||S.token),Accept:accept||'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},
    body:body?JSON.stringify(body):undefined});
  return r;
}
async function ghGet(token){
  const r=await gh('GET',null,null,token);
  if(r.status===404)return null;
  if(r.status===401)throw new Error('Token ungültig oder abgelaufen');
  if(r.status===403)throw new Error('Kein Zugriff – Token-Rechte prüfen');
  if(!r.ok)throw new Error('GitHub antwortet mit '+r.status);
  const j=await r.json();
  let txt;
  if(j.content){txt=TD.decode(unb64(j.content.replace(/\s/g,'')))}
  else{const r2=await gh('GET',null,'application/vnd.github.raw+json',token);txt=await r2.text()}
  return {sha:j.sha,env:JSON.parse(txt)};
}
async function ghPut(env,sha,token){
  const body={message:'Tagebuch-Update '+new Date().toISOString().slice(0,16),content:btoa(JSON.stringify(env))};
  if(sha)body.sha=sha;
  const r=await gh('PUT',body,null,token);
  if(r.status===409||r.status===422)return 'conflict';
  if(!r.ok)throw new Error('Speichern auf GitHub fehlgeschlagen ('+r.status+')');
  const j=await r.json();return j.content&&j.content.sha;
}
function isIdArr(a){return Array.isArray(a)&&a.length>0&&a.every(x=>x&&typeof x==='object'&&'id' in x)}
function pick(x,y){if('u' in x||'u' in y)return (x.u||0)>=(y.u||0)?x:y;if('n' in x||'n' in y)return (x.n||0)>=(y.n||0)?x:y;return y}
function merge(a,b){
  if(a===undefined)return b;if(b===undefined)return a;
  if(Array.isArray(a)&&Array.isArray(b)){
    if((isIdArr(a)||!a.length)&&(isIdArr(b)||!b.length)){
      const m=new Map();a.forEach(x=>m.set(x.id,x));b.forEach(y=>{const x=m.get(y.id);m.set(y.id,x?pick(x,y):y)});return [...m.values()];
    }
    return b;
  }
  if(a&&b&&typeof a==='object'&&typeof b==='object'){
    if('u' in a||'u' in b)return (a.u||0)>(b.u||0)?a:b;
    const o={};new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>o[k]=merge(a[k],b[k]));return o;
  }
  return b;
}
function mergeDocs(local,remote){
  const [older,newer]=(local.updatedAt||0)>(remote.updatedAt||0)?[remote,local]:[local,remote];
  const m=merge(older,newer);m.updatedAt=Math.max(local.updatedAt||0,remote.updatedAt||0);return m;
}
let syncing=null;
async function syncNow(manual){
  if(!hasRemote()||!S.key){setSync('off');return}
  if(syncing)return syncing;
  syncing=(async()=>{
    setSync('syncing');
    try{
      for(let attempt=0;attempt<3;attempt++){
        const r=await ghGet();
        let changedFromRemote=false;
        if(r){
          if(r.env.salt!==CFG.salt)throw new Error('Daten auf GitHub nutzen eine andere Passphrase');
          const remote=await decWith(S.key,r.env);
          const before=JSON.stringify(S.data);
          const merged=mergeDocs(S.data,remote);
          changedFromRemote=JSON.stringify(merged)!==before;
          S.data=merged;if(cleanup())S.data.updatedAt=now();
          if(JSON.stringify(merged)===JSON.stringify(remote)){S.dirty=false;S.sync.sha=r.sha;await saveLocal();
            if(changedFromRemote)softRender();break}
        }
        const env=await makeEnvelope(S.data);
        const res=await ghPut(env,r&&r.sha);
        if(res==='conflict')continue;
        S.sync.sha=res;S.dirty=false;localStorage.setItem(LS_VAULT,JSON.stringify(env));
        if(changedFromRemote)softRender();
        break;
      }
      S.sync.last=now();setSync('ok','');if(manual)toast('Synchronisiert ✓');
    }catch(e){console.warn(e);setSync('error',e.message||String(e));if(manual)toast('Sync-Fehler: '+(e.message||e))}
    finally{syncing=null}
  })();
  return syncing;
}

function newLog(date,type){return {id:null,type:type||'nachgegeben',date:date||today(),ctx:[],people:[],need:null,feel:[],what:'',thought:'',gfk:{obs:'',feel:'',need:'',req:''}}}
function gfkSentence(g,fb={},off=[]){
  const f=off.includes('feel')?'':(g.feel||fb.feel||'').trim(),n=off.includes('need')?'':(g.need||fb.need||'').trim();
  const o=off.includes('obs')?'':(g.obs||'').replace(/^wenn\s+/i,'').trim();
  const r=off.includes('req')?'':(g.req||'').replace(/^wärst du bereit,?\s*/i,'').replace(/\?\s*$/,'').trim();
  if(!o&&!f&&!n&&!r)return '';
  let s='';
  if(o)s+=`Wenn ${o}, `;
  if(f)s+=o?`fühle ich mich ${f}`:`Ich fühle mich ${f}`;
  if(n)s+=f?`, weil mir ${n} wichtig ist.`:(o?`ist mir ${n} wichtig.`:`Mir ist ${n} wichtig.`);
  else if(f)s+='.';
  else if(o)s=s.replace(/, $/,'.');
  if(r)s+=` Wärst du bereit, ${r}?`;
  return s.trim();
}

function weekDates(k){
  const [y,w]=k.split('-W').map(Number);const jan4=new Date(y,0,4);const mon=weekStart(ymd(jan4));
  const start=addDays(mon,(w-1)*7);return [...Array(7)].map((_,i)=>addDays(start,i));
}
function shiftWeek(k,n){return isoWeek(addDays(weekDates(k)[0],n*7))}

  ['signals','feelings','contexts','people'].forEach(k=>{if(j[k])j[k].forEach(t=>addToList(k,t))});
  (j.affirmations||[]).forEach(t=>{if(!D.affirmations.some(a=>a.text===t&&!a.del))D.affirmations.push({id:uid(),text:t,u:now()})});
  if(j.blocks&&j.blocks.length){const w=getWeek(isoWeek(today()));j.blocks.forEach(b=>{if(!w.blocks.some(x=>x.what===b.what))w.blocks.push({id:uid(),day:b.day,time:b.time||'',dur:b.dur||'',what:b.what,need:(D.needs.find(n=>n.name===b.need)||{}).id||null,status:'offen',u:now()})})}
  D.imported=true;cleanup();touch();rr();toast('Startdaten importiert ✓ – die Datei kannst du jetzt löschen');
}
function listEditor(key,title,withIcon){
  const items=live(S.data[key]);
  return h('details',{class:'acc'},h('summary',null,title+' ('+items.length+')'),
    items.map(x=>h('div',{class:'row',style:'margin:6px 0'},
      withIcon&&h('input',{class:'field',style:'width:52px;text-align:center;padding:8px 4px',value:x.icon||'',oninput:e=>{x.icon=e.target.value.trim();x.u=now();touch()}}),
      h('input',{class:'field grow',value:x.name,onchange:e=>{const v=e.target.value.trim();if(v){x.name=v;x.u=now();touch()}}}),
      h('button',{class:'iconbtn',onclick:()=>{if(confirm(`„${x.name}“ entfernen? Bisherige Einträge bleiben erhalten.`)){x.del=true;x.u=now();touch();rr()}},'aria-label':'entfernen'},'×'))),
    adder('Neu …',t=>{const it=addToList(key,t);if(withIcon&&!it.icon)it.icon='🌿';touch();rr()}));
}
function vSettings(){
  const f={owner:CFG.owner||'waswollenwirkochen',repo:CFG.repo||'beduerfnisse-data',token:''};
  const I=(k,ph,type='text')=>h('input',{class:'field',type,placeholder:ph,value:f[k],autocomplete:'off',autocapitalize:'off',spellcheck:'false',oninput:e=>f[k]=e.target.value.trim()});
  const pw={old:'',n1:'',n2:''};const pwErr=h('div',{class:'err'});
  const last=S.sync.last?new Date(S.sync.last).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'–';
  return [
    installCard(),
    card('Sync',null,
      h('div',{class:'row'},h('span',{class:'dot '+S.sync.state}),h('span',{class:'small'},syncLabel())),
      hasRemote()&&h('div',{class:'small faint mt'},`${CFG.owner}/${CFG.repo} · zuletzt ${last}`),
      hasRemote()&&h('button',{class:'btn ghost full mt',onclick:()=>syncNow(true).then(rr)},'Jetzt synchronisieren'),
      h('details',{class:'acc mt'},h('summary',null,hasRemote()?'GitHub-Verbindung ändern':'GitHub-Sync einrichten'),
        h('label',{class:'lbl'},'GitHub-Account'),I('owner','Account'),
        h('label',{class:'lbl'},'Daten-Repo (privat)'),I('repo','Repo'),
        h('label',{class:'lbl'},'Token'+(S.token?' (leer lassen = bisheriger)':'')),I('token','github_pat_…','password'),
        h('button',{class:'btn full mt',onclick:async()=>{
          const tok=f.token||S.token;if(!tok||!f.owner||!f.repo){toast('Bitte alles ausfüllen');return}
          CFG.owner=f.owner;CFG.repo=f.repo;CFG.path=CFG.path||'diary.enc.json';S.token=tok;CFG.tokenEnv=await encWith(S.key,tok);saveCfg();
          S.dirty=true;await syncNow(true);rr()}},'Speichern & verbinden'),
        hasRemote()&&h('button',{class:'link mt',style:'color:var(--rose)',onclick:()=>{CFG.owner='';CFG.repo='';CFG.tokenEnv=null;S.token=null;saveCfg();setSync('off');rr()}},'Sync auf diesem Gerät trennen'))),
    card('Persönliches',null,
      h('label',{class:'lbl'},'Dein Name (für die Begrüßung)'),h('input',{class:'field',value:S.data.profile.name||'',oninput:e=>{S.data.profile.name=e.target.value;touch()}})),
    card('Deine Listen','Umbenennen, Emoji ändern, ergänzen.',
      listEditor('needs','Kernbedürfnisse',true),listEditor('signals','Körpersignale'),listEditor('feelings','Gefühle im Log'),
      listEditor('contexts','Bereiche im Log'),listEditor('people','Beteiligte im Log'),listEditor('reactions','Reaktionen im Log')),
    card('Sperre','Nach wie vielen Minuten ohne Nutzung (oder im Hintergrund) gesperrt wird.',
      h('div',{class:'chips'},[1,3,5,10,30].map(m=>chip(m+' min',(CFG.lockMin||5)===m,()=>{CFG.lockMin=m;saveCfg();rr()}))),
      h('button',{class:'btn ghost full mt',onclick:lock},'🔒 Jetzt sperren')),
    card('Backup & Import',null,
      h('div',{class:'row wrap'},
        h('button',{class:'btn ghost',onclick:async()=>{const env=await makeEnvelope(S.data);const a=h('a',{href:URL.createObjectURL(new Blob([JSON.stringify(env)],{type:'application/json'})),download:`beduerfnis-backup-${today()}.json`});document.body.append(a);a.click();a.remove()}},'⬇︎ Verschlüsseltes Backup'),
        importButton('⬆︎ Import')),
      h('p',{class:'small faint mt'},'Import: verschlüsseltes Backup oder startdaten.json.')),
    card('Passphrase ändern','Danach brauchst du auf anderen Geräten die neue Passphrase (dort einmal zurücksetzen und neu einrichten).',
      h('input',{class:'field',type:'password',placeholder:'aktuelle Passphrase',autocomplete:'current-password',oninput:e=>pw.old=e.target.value}),h('div',{style:'height:8px'}),
      h('input',{class:'field',type:'password',placeholder:'neue Passphrase',autocomplete:'new-password',oninput:e=>pw.n1=e.target.value}),h('div',{style:'height:8px'}),
      h('input',{class:'field',type:'password',placeholder:'neue Passphrase wiederholen',autocomplete:'new-password',oninput:e=>pw.n2=e.target.value}),
      h('button',{class:'btn ghost full mt',onclick:async()=>{
        pwErr.textContent='';
        try{const k=await deriveKey(pw.old,CFG.salt,CFG.iter);await decWith(k,JSON.parse(localStorage.getItem(LS_VAULT)))}catch(e){pwErr.textContent='Aktuelle Passphrase stimmt nicht.';return}
        if(pw.n1.length<8||pw.n1!==pw.n2){pwErr.textContent='Neue Passphrase: mind. 8 Zeichen, beide gleich.';return}
        if(hasRemote()){try{await syncNow()}catch(e){}}
        CFG.salt=b64(crypto.getRandomValues(new Uint8Array(16)));CFG.iter=ITER;S.key=await deriveKey(pw.n1,CFG.salt,CFG.iter);
        if(S.token)CFG.tokenEnv=await encWith(S.key,S.token);saveCfg();const env=await saveLocal();
        if(hasRemote()){try{const r=await ghGet();await ghPut(env,r&&r.sha);setSync('ok','')}catch(e){setSync('error',e.message)}}
        toast('Passphrase geändert ✓');rr()}},'Passphrase ändern'),pwErr),
    card('Auf diesem Gerät',null,
      h('button',{class:'btn danger full',onclick:()=>{if(confirm('Alle lokalen Daten auf diesem Gerät löschen? Was auf GitHub liegt, bleibt erhalten.')){localStorage.removeItem(LS_VAULT);localStorage.removeItem(LS_CFG);CFG=null;S.key=null;S.data=null;S.token=null;render()}}},'Lokale Daten löschen')),
    h('p',{class:'center faint small'},'Verschlüsselung: AES-256-GCM · PBKDF2-SHA256 ('+(CFG.iter||ITER).toLocaleString('de-DE')+' Runden) · keine externen Anfragen außer api.github.com')
  ];
}

/* ---------- App-Installation ---------- */
let installEvt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(S.view==='settings'&&S.key)render()});
addEventListener('appinstalled',()=>{installEvt=null;toast('Als App installiert ✓')});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(e=>console.warn(e));
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
function installCard(){
  if(isStandalone())return null;
  return card('📲 Als App nutzen','Dann startet das Tagebuch wie eine App – ohne Browserleiste, mit eigenem Symbol und auch offline.',
    installEvt?h('button',{class:'btn full',onclick:async()=>{installEvt.prompt();const r=await installEvt.userChoice;installEvt=null;render();if(r.outcome==='accepted')toast('Wird installiert …')}},'App installieren')
    :h('p',{class:'small muted mb0'},'Im Browser-Menü (⋮ oben rechts) auf „App installieren“ oder „Zum Startbildschirm hinzufügen“ tippen. Auf dem iPhone: Teilen-Symbol → „Zum Home-Bildschirm“.'));
}

/* ---------- Start ---------- */
loadCfg();render();
</script>
